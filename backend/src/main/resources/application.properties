spring.application.name=shopsphere
server.port=8080

# SQL Server (override with environment variables)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:shopsphere};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong@Passw0rd}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: base64-encoded key, at least 32 bytes. Change in production.
app.jwt.secret=${JWT_SECRET:c2hvcHNwaGVyZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0wMTIzNDU2Nzg5}
app.jwt.expiration-ms=86400000

springdoc.swagger-ui.path=/swagger-ui.html
