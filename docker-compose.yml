services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 25s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    command: /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P YourStrong@Passw0rd -Q "IF DB_ID('shopsphere') IS NULL CREATE DATABASE shopsphere"

  backend:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: shopsphere
      DB_USER: sa
      DB_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "8081:8080"
